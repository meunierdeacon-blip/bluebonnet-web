# Fly.io config for the builder app. Steps are in LAUNCH.md.
# `app` must be unique across all of Fly. If "bluebonnet-builder" is taken, change it here and in LAUNCH.md.
app = "bluebonnet-builder"
primary_region = "dfw"  # Dallas, closest to Central Texas

[build]

[env]
  PORT = "8080"
  BLUEBONNET_DATA = "/data"

# Accounts and sites live in one SQLite file on this volume. Fly snapshots it daily.
[[mounts]]
  source = "bluebonnet_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Customer sites should load instantly, so keep the one machine running.
  # Run exactly ONE machine: SQLite lives on its volume and can't be shared.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
